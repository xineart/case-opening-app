<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootBox Casino - CS2 Case Opening</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER / ENGINES -->
  <header>
    <div class="logo">
      <span>📦</span> LOOTDROP.GG
    </div>
    <div class="user-stats">
      <div class="balance-box">
        <span>Egyenleg:</span>
        <span id="user-balance">$100.00</span>
      </div>
      <button class="btn btn-success" onclick="openDepositModal()">+ Feltöltés</button>
      <button class="btn" id="auth-btn">Bejelentkezés</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- PÖRGETŐ SECTOIN -->
    <section class="case-display-area">
      <h2>Hyper Beast Edition Case</h2>
      <p style="color: var(--text-muted); margin-top: 5px;">Nyisd ki a ládát $25.00 áron</p>

      <!-- ROULETTE SPINNER -->
      <div class="spinner-wrapper">
        <div class="spinner-track" id="spinner-track">
          <!-- A JS ide generálja majd a pörgető kártyákat -->
        </div>
      </div>

      <button class="btn btn-gold" id="open-case-btn" style="padding: 1rem 3rem; font-size: 1.1rem;">
        LÁDA NYITÁSA ($25.00)
      </button>
    </section>

    <!-- LÁDA TARTALMA (LOOT TABLE) -->
    <section>
      <div class="section-title">Láda Tartalma</div>
      <div class="items-grid" id="case-items-grid">
        
        <!-- PÉLDA TÁRGY KÁRTYÁK -->
        <div class="item-card milspec">
          <img src="https://via.placeholder.com/150/4b69ff?text=P250" alt="Item">
          <div class="item-name">P250 | Ripple</div>
          <div class="item-price">$1.20</div>
        </div>

        <div class="item-card restricted">
          <img src="https://via.placeholder.com/150/8847ff?text=AK-47" alt="Item">
          <div class="item-name">AK-47 | Point Disarray</div>
          <div class="item-price">$18.50</div>
        </div>

        <div class="item-card classified">
          <img src="https://via.placeholder.com/150/d32ce6?text=M4A4" alt="Item">
          <div class="item-name">M4A4 | Desolate Space</div>
          <div class="item-price">$45.00</div>
        </div>

        <div class="item-card covert">
          <img src="https://via.placeholder.com/150/eb4b4b?text=AWP+Hyper" alt="Item">
          <div class="item-name">AWP | Hyper Beast</div>
          <div class="item-price">$120.00</div>
        </div>

        <div class="item-card gold">
          <img src="https://via.placeholder.com/150/caab05?text=Karambit" alt="Item">
          <div class="item-name">★ Karambit | Gamma Doppler</div>
          <div class="item-price">$1,450.00</div>
        </div>

      </div>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
