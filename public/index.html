<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Lootbox Platform</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="logo">ENTERPRISE CASINO</div>
    <div class="user-control">
      <div id="authContainer">
        <button class="btn btn-secondary" onclick="openAuthModal('login')">Bejelentkezés</button>
        <button class="btn btn-primary" onclick="openAuthModal('register')">Regisztráció</button>
      </div>
      <div id="userProfile" class="user-profile hidden">
        <div class="balance-card">
          <span>Egyenleg:</span>
          <strong id="userBalance">$0.00</strong>
        </div>
        <div class="username-tag" id="userNameTag">User</div>
        <button class="btn btn-secondary btn-sm" onclick="logout()">Kijelentkezés</button>
      </div>
    </div>
  </header>

  <!-- FŐ TARTALOM -->
  <main>
    <!-- PÖRGETŐ ARÉNA -->
    <section class="arena-card">
      <div class="case-header">
        <h1 class="case-title">Hyper Beast Edition Case</h1>
        <div class="case-price">Ár: $25.00</div>
      </div>

      <!-- ANIMÁCIÓS SZALAG -->
      <div class="spinner-viewport">
        <div class="pointer"></div>
        <div class="spinner-track" id="spinnerTrack"></div>
      </div>

      <div class="controls">
        <button class="btn btn-action" id="spinBtn" onclick="spinCase()">LÁDA NYITÁSA ($25.00)</button>
      </div>
    </section>

    <!-- PROVABLY FAIR INFORMÁCIÓK -->
    <section class="pf-card hidden" id="pfCard">
      <h3>Provably Fair Védelem (SHA-256)</h3>
      <div class="pf-grid">
        <div><span>Server Seed Hash:</span> <code id="pfServerHash">-</code></div>
        <div><span>Client Seed:</span> <code id="pfClientSeed">-</code></div>
        <div><span>Nonce:</span> <code id="pfNonce">-</code></div>
      </div>
    </section>

    <!-- RAKTÁR / INVENTORY -->
    <section class="inventory-section">
      <h2>Saját Raktár (Inventory)</h2>
      <div class="inventory-grid" id="inventoryGrid">
        <div class="empty-msg">Jelentkezz be a raktárad megtekintéséhez!</div>
      </div>
    </section>
  </main>

  <!-- AUTH MODAL (Regisztráció / Bejelentkezés) -->
  <div class="modal-overlay hidden" id="authModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeAuthModal()">&times;</button>
      <h2 id="modalTitle">Bejelentkezés</h2>
      
      <form id="authForm" onsubmit="handleAuthSubmit(event)">
        <div class="form-group">
          <label>Felhasználónév</label>
          <input type="text" id="authUsername" required placeholder="Felhasználónév">
        </div>

        <div class="form-group hidden" id="emailGroup">
          <label>E-mail cím</label>
          <input type="email" id="authEmail" placeholder="email@domain.hu">
        </div>

        <div class="form-group">
          <label>Jelszó</label>
          <input type="password" id="authPassword" required placeholder="••••••••">
        </div>

        <div class="error-msg hidden" id="authError"></div>

        <button type="submit" class="btn btn-primary btn-full" id="authSubmitBtn">Bejelentkezés</button>
      </form>
    </div>
  </div>

  <!-- NYEREMÉNY MODAL -->
  <div class="modal-overlay hidden" id="winModal">
    <div class="modal-card win-card">
      <h2>GRATULÁLUNK!</h2>
      <div class="win-image-wrap">
        <img id="winImg" src="" alt="Nyeremény">
      </div>
      <h3 id="winName">Item Name</h3>
      <div class="win-price" id="winPrice">$0.00</div>
      <button class="btn btn-action btn-full" onclick="closeWinModal()">Rendben</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
