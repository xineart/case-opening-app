<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoCases — Premium Case Opener</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-body: #080a0f;
            --bg-nav: #0d111a;
            --bg-card: #131924;
            --bg-card-hover: #192232;
            --bg-input: #0a0d14;
            
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.25);
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-red: #ef4444;

            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --border: #1e293b;
            --border-highlight: #334155;

            --rare-common: #94a3b8;
            --rare-uncommon: #38bdf8;
            --rare-rare: #818cf8;
            --rare-mythical: #c084fc;
            --rare-legendary: #f43f5e;
            --rare-immortal: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(12px);
        }

        .nav-inner {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0.8rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.4rem;
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: -0.5px;
        }

        .logo-box {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            box-shadow: 0 0 15px var(--accent-gold-glow);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .balance-badge {
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .balance-amount {
            font-weight: 700;
            color: var(--accent-gold);
            font-size: 1rem;
        }

        .btn {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover {
            border-color: var(--border-highlight);
            transform: translateY(-1px);
        }

        .btn-gold {
            background: linear-gradient(135deg, var(--accent-gold), #d97706);
            color: #000;
            border: none;
            font-weight: 700;
            box-shadow: 0 4px 15px var(--accent-gold-glow);
        }

        .btn-gold:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-green { background: var(--accent-green); color: #fff; border: none; }
        .btn-red { background: var(--accent-red); color: #fff; border: none; }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
            width: 100%;
            flex: 1;
        }

        .game-stage {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .case-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .case-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        .spinner-viewport {
            position: relative;
            width: 100%;
            height: 180px;
            background: var(--bg-body);
            border-radius: 14px;
            overflow: hidden;
            border: 2px solid var(--border);
            margin-bottom: 30px;
        }

        .spinner-line {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 4px;
            background: var(--accent-gold);
            z-index: 20;
            transform: translateX(-50%);
            box-shadow: 0 0 20px var(--accent-gold);
        }

        .spinner-track {
            display: flex;
            position: absolute;
            left: 0;
            top: 15px;
            gap: 12px;
            will-change: transform;
        }

        .spinner-card {
            min-width: 140px;
            height: 148px;
            background: var(--bg-card);
            border-radius: 10px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            position: relative;
            border-bottom: 4px solid var(--rare-common);
        }

        .spinner-card img {
            width: 75px;
            height: 75px;
            object-fit: contain;
        }

        .spinner-card .item-title {
            font-size: 0.75rem;
            font-weight: 600;
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .spinner-card .item-val {
            font-size: 0.8rem;
            color: var(--accent-gold);
            font-weight: 700;
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .case-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            transition: all 0.25s ease;
            cursor: pointer;
        }

        .case-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-gold);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .case-card img {
            width: 130px;
            height: 130px;
            object-fit: contain;
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }

        .case-card h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .case-card .price {
            color: var(--accent-gold);
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .inv-box {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
        }

        .inv-header {
            padding: 20px 25px;
            background: var(--bg-nav);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .inv-body {
            padding: 25px;
            display: none;
            border-top: 1px solid var(--border);
        }

        .inv-body.open {
            display: block;
        }

        .inv-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .inv-card {
            background: var(--bg-body);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            border-bottom: 4px solid var(--rare-common);
        }

        .inv-card img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 8px;
        }

        .inv-card .name {
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .inv-card .val {
            font-size: 0.85rem;
            color: var(--accent-gold);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(6px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border-highlight);
            border-radius: 20px;
            max-width: 480px;
            width: 100%;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .form-input {
            width: 100%;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 6px;
            margin-bottom: 16px;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-inner">
            <a href="#" class="logo">
                <div class="logo-box">⚡</div>
                <span>CryptoCases</span>
            </a>

            <div class="user-controls">
                <div class="balance-badge">
                    <span style="color: var(--text-muted);">Egyenleg:</span>
                    <span class="balance-amount" id="user-balance">0.00</span>
                    <span style="color: var(--accent-gold); font-weight: 800;">USDT</span>
                </div>

                <button class="btn btn-green" onclick="openModal('deposit-modal')">💳 Befizetés</button>

                <div id="guest-ui" style="display: flex; gap: 8px;">
                    <button class="btn" onclick="openModal('login-modal')">Belépés</button>
                    <button class="btn btn-gold" onclick="openModal('register-modal')">Regisztráció</button>
                </div>

                <div id="auth-ui" style="display: none; align-items: center; gap: 10px;">
                    <span id="user-display-name" style="font-weight: 700; font-size: 0.95rem;">-</span>
                    <button class="btn btn-red" onclick="logout()">🚪 Kijelentkezés</button>
                </div>
            </div>
        </div>
    </header>

    <main>
        <section class="game-stage">
            <h2 class="case-title" id="active-title">Válassz egy ládát!</h2>
            <p class="case-sub" id="active-sub">Kattints az egyik alábbi ládára a nyitáshoz</p>

            <div class="spinner-viewport">
                <div class="spinner-line"></div>
                <div class="spinner-track" id="spinner-track"></div>
            </div>

            <button class="btn btn-gold" id="open-btn" style="font-size: 1.1rem; padding: 14px 45px;" onclick="startRoll()" disabled>
                LÁDA NYITÁSA
            </button>
        </section>

        <div class="section-title">
            <span>Elérhető Ládák</span>
            <span style="color: var(--text-muted); font-size: 0.9rem;" id="cases-count">0 láda</span>
        </div>
        <div class="cases-grid" id="cases-grid"></div>

        <div class="inv-box">
            <div class="inv-header" onclick="toggleInv()">
                <div style="display: flex; align-items: center; gap: 10px;">
                    <h3 style="font-weight: 700;">🎒 Saját Leltár</h3>
                    <span id="inv-count" style="color: var(--accent-gold); font-weight: 700;">(0 tárgy)</span>
                </div>
                <div>
                    <span id="inv-arrow">▼</span>
                </div>
            </div>
            <div class="inv-body" id="inv-body">
                <div class="inv-grid" id="inv-grid">
                    <p style="color: var(--text-muted); grid-column: 1/-1;">Még nincs tárgy a leltáradban.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Bejelentkezés Modal -->
    <div class="modal-bg" id="login-modal">
        <div class="modal-card">
            <div class="modal-head">
                <h3>Bejelentkezés</h3>
                <button class="btn" type="button" onclick="closeModal('login-modal')">&times;</button>
            </div>
            <form onsubmit="handleLogin(event)">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Felhasználónév</label>
                <input type="text" id="login-username" class="form-input" required autocomplete="username">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Jelszó</label>
                <input type="password" id="login-password" class="form-input" required autocomplete="current-password">
                <button type="submit" class="btn btn-gold" style="width: 100%;">Belépés</button>
            </form>
        </div>
    </div>

    <!-- Regisztráció Modal -->
    <div class="modal-bg" id="register-modal">
        <div class="modal-card">
            <div class="modal-head">
                <h3>Regisztráció</h3>
                <button class="btn" type="button" onclick="closeModal('register-modal')">&times;</button>
            </div>
            <form onsubmit="handleRegister(event)">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Felhasználónév</label>
                <input type="text" id="reg-username" class="form-input" required autocomplete="username">
                <label style="font-size: 0.85rem; color: var(--text-secondary);">Jelszó</label>
                <input type="password" id="reg-password" class="form-input" required autocomplete="new-password">
                <button type="submit" class="btn btn-gold" style="width: 100%;">Fiók Létrehozása</button>
            </form>
        </div>
    </div>

    <!-- Befizetés Modal -->
    <div class="modal-bg" id="deposit-modal">
        <div class="modal-card" style="text-align: center;">
            <div class="modal-head">
                <h3>Befizetés (Demo)</h3>
                <button class="btn" type="button" onclick="closeModal('deposit-modal')">&times;</button>
            </div>
            <p style="color: var(--text-secondary); margin-bottom: 20px;">Válassz egy összeget a teszt egyenleg feltöltéséhez:</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-bottom: 20px;">
                <button class="btn btn-gold" type="button" onclick="addBalance(50)">+$50 USDT</button>
                <button class="btn btn-gold" type="button" onclick="addBalance(250)">+$250 USDT</button>
                <button class="btn btn-gold" type="button" onclick="addBalance(1000)">+$1000 USDT</button>
            </div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token') || null;
        let currentUser = null;
        let selectedCase = null;

        const cases = [
            { id: 'c1', name: 'Kezdő Kripto Láda', price: 15.00, img: 'https://images.unsplash.com/photo-1622979135225-d2ba269bc1bd?w=400&auto=format&fit=crop&q=80' },
            { id: 'c2', name: 'VIP High Roller', price: 150.00, img: 'https://images.unsplash.com/photo-1639762681485-074b7f938ba0?w=400&auto=format&fit=crop&q=80' }
        ];

        const itemsPool = [
            { name: 'AK-47 | Neon Rider', price: 45.00, rarity: 'var(--rare-legendary)', img: 'https://images.unsplash.com/photo-1595590424283-b8f17842773f?w=300&auto=format&fit=crop&q=80' },
            { name: 'M4A4 | Cyber Dragon', price: 120.00, rarity: 'var(--rare-mythical)', img: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=300&auto=format&fit=crop&q=80' },
            { name: 'Karambit | Gold Crypto', price: 850.00, rarity: 'var(--rare-immortal)', img: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=300&auto=format&fit=crop&q=80' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if (token) fetchProfile();
            renderCases();
            buildTrack();
        });

        async function fetchProfile() {
            try {
                const res = await fetch('/api/user/me', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    currentUser = data;
                    document.getElementById('user-balance').innerText = currentUser.balance.toFixed(2);
                    document.getElementById('user-display-name').innerText = currentUser.username;
                    document.getElementById('guest-ui').style.display = 'none';
                    document.getElementById('auth-ui').style.display = 'flex';
                    renderInventory();
                } else {
                    logout();
                }
            } catch (err) {
                console.error('Profile fetch error:', err);
            }
        }

        async function handleRegister(e) {
            if (e) e.preventDefault();
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!username || !password) {
                return alert('Add meg a nevet és jelszót!');
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    closeModal('register-modal');
                    alert('Sikeres regisztráció!');
                    fetchProfile();
                } else {
                    alert(data.error || 'Hiba történt a regisztráció során!');
                }
            } catch (err) {
                alert('Szerver elérés hiba! Próbáld újra később.');
            }
        }

        async function handleLogin(e) {
            if (e) e.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value.trim();

            if (!username || !password) {
                return alert('Add meg a nevet és jelszót!');
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();
                if (res.ok) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    closeModal('login-modal');
                    alert('Sikeres bejelentkezés!');
                    fetchProfile();
                } else {
                    alert(data.error || 'Hibás név vagy jelszó!');
                }
            } catch (err) {
                alert('Szerver elérés hiba! Próbáld újra később.');
            }
        }

        function logout() {
            token = null;
            currentUser = null;
            localStorage.removeItem('token');
            document.getElementById('user-balance').innerText = '0.00';
            document.getElementById('guest-ui').style.display = 'flex';
            document.getElementById('auth-ui').style.display = 'none';
        }

        function renderCases() {
            const grid = document.getElementById('cases-grid');
            grid.innerHTML = '';
            document.getElementById('cases-count').innerText = `${cases.length} láda`;

            cases.forEach(c => {
                grid.innerHTML += `
                    <div class="case-card" onclick="selectCase('${c.id}')">
                        <img src="${c.img}">
                        <h3>${c.name}</h3>
                        <div class="price">$${c.price.toFixed(2)} USDT</div>
                        <button class="btn btn-gold" style="width: 100%;">Kiválasztás</button>
                    </div>
                `;
            });
        }

        function selectCase(id) {
            selectedCase = cases.find(c => c.id === id);
            document.getElementById('active-title').innerText = selectedCase.name;
            document.getElementById('active-sub').innerText = `Nyitási ár: $${selectedCase.price.toFixed(2)} USDT`;
            document.getElementById('open-btn').disabled = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function buildTrack() {
            const track = document.getElementById('spinner-track');
            track.style.transition = 'none';
            track.style.transform = 'translateX(0px)';
            track.innerHTML = '';

            for (let i = 0; i < 80; i++) {
                const item = itemsPool[Math.floor(Math.random() * itemsPool.length)];
                const card = document.createElement('div');
                card.className = 'spinner-card';
                card.style.borderBottomColor = item.rarity;
                card.innerHTML = `
                    <img src="${item.img}">
                    <div class="item-title">${item.name}</div>
                    <div class="item-val">$${item.price.toFixed(2)}</div>
                `;
                track.appendChild(card);
            }
        }

        async function startRoll() {
            if (!currentUser) return openModal('login-modal');
            if (currentUser.balance < selectedCase.price) return alert('Nincs elég egyenleged!');

            document.getElementById('open-btn').disabled = true;

            try {
                const res = await fetch('/api/cases/open', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ caseId: selectedCase.id })
                });

                const data = await res.json();
                if (!res.ok) {
                    alert(data.error);
                    document.getElementById('open-btn').disabled = false;
                    return;
                }

                buildTrack();

                const track = document.getElementById('spinner-track');
                const winningIndex = 55;
                const itemWidth = 152;
                const targetPos = (winningIndex * itemWidth) - (document.querySelector('.spinner-viewport').offsetWidth / 2);

                const wonItemCard = track.children[winningIndex];
                wonItemCard.style.borderBottomColor = data.wonItem.rarity || 'var(--rare-legendary)';
                wonItemCard.innerHTML = `
                    <img src="${data.wonItem.img || itemsPool[0].img}">
                    <div class="item-title">${data.wonItem.name}</div>
                    <div class="item-val">$${data.wonItem.price.toFixed(2)}</div>
                `;

                setTimeout(() => {
                    track.style.transition = `transform 5s cubic-bezier(0.05, 0.9, 0.1, 1)`;
                    track.style.transform = `translateX(-${targetPos}px)`;
                }, 50);

                setTimeout(() => {
                    currentUser.balance = data.newBalance;
                    document.getElementById('user-balance').innerText = currentUser.balance.toFixed(2);
                    fetchProfile();
                    alert(`🎉 Nyereményed: ${data.wonItem.name} ($${data.wonItem.price.toFixed(2)} USDT)`);
                    document.getElementById('open-btn').disabled = false;
                }, 5200);

            } catch (err) {
                alert('Hiba történt a nyitás során!');
                document.getElementById('open-btn').disabled = false;
            }
        }

        async function addBalance(amount) {
            if (!currentUser) return openModal('login-modal');
            try {
                const res = await fetch('/api/user/deposit', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${token}` 
                    },
                    body: JSON.stringify({ amount })
                });
                if (res.ok) {
                    closeModal('deposit-modal');
                    fetchProfile();
                } else {
                    alert('Hiba a feltöltésnél');
                }
            } catch (err) {
                alert('Szerver hiba');
            }
        }

        function renderInventory() {
            if (!currentUser) return;
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            document.getElementById('inv-count').innerText = `(${currentUser.inventory ? currentUser.inventory.length : 0} tárgy)`;

            if (!currentUser.inventory || currentUser.inventory.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); grid-column: 1/-1;">Még nincs tárgy a leltáradban.</p>';
                return;
            }

            currentUser.inventory.forEach(item => {
                grid.innerHTML += `
                    <div class="inv-card">
                        <img src="${item.img || itemsPool[0].img}">
                        <div class="name">${item.name}</div>
                        <div class="val">$${item.price ? item.price.toFixed(2) : '0.00'}</div>
                    </div>
                `;
            });
        }

        function toggleInv() {
            const body = document.getElementById('inv-body');
            body.classList.toggle('open');
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    </script>
</body>
</html>
