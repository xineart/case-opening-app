<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LootBox Casino - CS2 Case Opening</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER / NAVBAR -->
  <header>
    <div class="logo">
      <span>📦</span> LOOTDROP.GG
    </div>
    <div class="user-stats">
      <div class="balance-box">
        <span>Egyenleg:</span>
        <span id="user-balance">$0.00</span>
      </div>
      <button class="btn btn-success" onclick="openDepositModal()">+ Feltöltés</button>
      <button class="btn" id="auth-btn" onclick="openAuthModal()">Bejelentkezés</button>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="main-container">

    <!-- PÖRGETŐ SECTION -->
    <section class="case-display-area">
      <h2>Hyper Beast Edition Case</h2>
      <p style="color: var(--text-muted); margin-top: 5px;">Nyisd ki a ládát $25.00 áron</p>

      <!-- ROULETTE SPINNER -->
      <div class="spinner-wrapper">
        <div class="spinner-track" id="spinner-track">
          <!-- A JS ide generálja a pörgető kártyákat -->
        </div>
      </div>

      <button class="btn btn-gold" id="open-case-btn" style="padding: 1rem 3rem; font-size: 1.1rem;">
        LÁDA NYITÁSA ($25.00)
      </button>
    </section>

    <!-- SAJÁT LELTÁR (INVENTORY) SECTION -->
    <section style="margin-bottom: 3rem;">
      <div class="section-title">Saját Leltár (Inventory)</div>
      <div class="items-grid" id="inventory-grid">
        <!-- A JS ide tölti be a játékos meglévő tárgyait -->
      </div>
    </section>

    <!-- LÁDA TARTALMA (LOOT TABLE) -->
    <section>
      <div class="section-title">Láda Tartalma</div>
      <div class="items-grid" id="case-items-grid">
        <!-- A JS ide tölti be a láda tartalmát -->
      </div>
    </section>

  </main>

  <!-- AUTH MODAL (BEJELENTKEZÉS / REGISZTRÁCIÓ) -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal-content">
      <span class="modal-close" onclick="closeAuthModal()">&times;</span>
      <h3 id="auth-title">Bejelentkezés</h3>

      <div class="form-group">
        <label>Felhasználónév:</label>
        <input type="text" id="auth-username" placeholder="Felhasználónév">
      </div>

      <div class="form-group" id="email-group" style="display: none;">
        <label>E-mail cím:</label>
        <input type="email" id="auth-email" placeholder="Email cím">
      </div>

      <div class="form-group">
        <label>Jelszó:</label>
        <input type="password" id="auth-password" placeholder="Jelszó">
      </div>

      <button class="btn btn-gold" id="auth-submit-btn" onclick="handleAuthSubmit()" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
        BEJELENTKEZÉS
      </button>

      <p style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: var(--text-muted);">
        <span id="auth-toggle-text">Nincs még fiókod?</span> 
        <a href="#" id="auth-toggle-btn" onclick="toggleAuthMode(event)" style="color: var(--accent-gold); text-decoration: none; font-weight: bold;">Regisztráció</a>
      </p>
    </div>
  </div>

  <!-- DEPOSIT MODAL (BEFIZETÉSI ABLAK) -->
  <div id="deposit-modal" class="modal-overlay">
    <div class="modal-content">
      <span class="modal-close" onclick="closeDepositModal()">&times;</span>
      <h3>Egyenleg Feltöltése</h3>
      <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem;">
        Válassz összeget és kriptovalutát a feltöltéshez.
      </p>

      <div class="form-group">
        <label>Összeg ($ USD):</label>
        <input type="number" id="deposit-amount" min="5" value="25" step="5">
      </div>

      <div class="form-group">
        <label>Fizetési Mód:</label>
        <select id="deposit-currency">
          <option value="USDT">Tether (USDT - TRC20)</option>
          <option value="BTC">Bitcoin (BTC)</option>
          <option value="ETH">Ethereum (ETH)</option>
          <option value="LTC">Litecoin (LTC)</option>
        </select>
      </div>

      <button class="btn btn-gold" onclick="processDeposit()" style="width: 100%; margin-top: 1rem; padding: 0.8rem;">
        FIZETÉS INDÍTÁSA
      </button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
